name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or reuse the draft release
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.slice('refs/tags/'.length)
              : `v${version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            let release = releases.find((r) => r.draft && r.tag_name === tag);
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `ntsx ${tag}`,
                body: [
                  '### Ephemeral Node/TS Script Runner (`ntsx`)',
                  '',
                  'Download the standalone `ntsx` binary executable for your platform:',
                  '- **Linux x86_64:** `ntsx-linux-x86_64`',
                  '- **Linux ARM64:** `ntsx-linux-aarch64`',
                  '- **Windows x86_64:** `ntsx-windows-x86_64.exe`',
                  '- **Windows ARM64:** `ntsx-windows-aarch64.exe`',
                  '',
                  'Or install via npm:',
                  '```bash',
                  'npm install -g @kreisler/ntsx',
                  '```',
                ].join('\n'),
                draft: true,
                prerelease: false,
              }));
            }
            core.setOutput('release_id', String(release.id));

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 & aarch64
            platform: ubuntu-22.04
            target: linux
          - name: Windows x86_64 & aarch64
            platform: windows-latest
            target: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'linux' && 'x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc,aarch64-pc-windows-msvc' }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install dependencies
        run: npm ci

      - name: Build JS CLI
        run: npm run build

      - name: Install Cross-compilation tools (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Rust binaries (Linux)
        if: matrix.target == 'linux'
        run: |
          mkdir -p assets
          cargo build --release --manifest-path rust/Cargo.toml --target x86_64-unknown-linux-gnu
          cp rust/target/x86_64-unknown-linux-gnu/release/ntsx assets/ntsx-linux-x86_64

          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
          cargo build --release --manifest-path rust/Cargo.toml --target aarch64-unknown-linux-gnu
          cp rust/target/aarch64-unknown-linux-gnu/release/ntsx assets/ntsx-linux-aarch64

      - name: Build Rust binaries (Windows)
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path assets
          cargo build --release --manifest-path rust/Cargo.toml --target x86_64-pc-windows-msvc
          Copy-Item rust/target/x86_64-pc-windows-msvc/release/ntsx.exe assets/ntsx-windows-x86_64.exe

          cargo build --release --manifest-path rust/Cargo.toml --target aarch64-pc-windows-msvc
          Copy-Item rust/target/aarch64-pc-windows-msvc/release/ntsx.exe assets/ntsx-windows-aarch64.exe

      - name: Upload Release Assets
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TARGET: ${{ matrix.target }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const release_id = Number(process.env.RELEASE_ID);
            const { owner, repo } = context.repo;
            const assetsDir = path.join(process.cwd(), 'assets');

            if (fs.existsSync(assetsDir)) {
              const files = fs.readdirSync(assetsDir);
              for (const file of files) {
                const filePath = path.join(assetsDir, file);
                const fileData = fs.readFileSync(filePath);
                console.log(`Uploading ${file}...`);
                await github.rest.repos.uploadReleaseAsset({
                  owner,
                  repo,
                  release_id,
                  name: file,
                  data: fileData,
                });
              }
            }

  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
