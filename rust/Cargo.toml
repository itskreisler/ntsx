[package]
name = "ntsx"
version = "0.1.8"
edition = "2021"
description = "Run Node/TS scripts with ephemeral dependencies (uv-style --with) via npm cache + symlink"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
